<!doctype html>
<html>
<head><meta charset="utf-8"><title>Canvas Only</title></head>
<body>
  <h1>Canvas-Hostile Page</h1>
  <!-- Zero interactive DOM elements: everything is drawn. The structural
       scanner finds nothing actionable → visual fallback must engage. -->
  <canvas id="c" width="800" height="600" style="border:1px solid #ccc"></canvas>
  <div id="report" data-marker="none">none</div>
  <script>
    const ctx = document.getElementById('c').getContext('2d');
    // Draw three fake "buttons"
    const spots = [{x:80,y:100,w:180,h:50,label:'Red',fill:'#c33'},
                   {x:320,y:100,w:180,h:50,label:'Green',fill:'#3a3',},
                   {x:80,y:200,w:180,h:50,label:'Blue',fill:'#33c'}];
    for (const s of spots) {
      ctx.fillStyle = s.fill; ctx.fillRect(s.x, s.y, s.w, s.h);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 18px sans-serif';
      ctx.fillText(s.label, s.x + 50, s.y + 32);
    }
    document.getElementById('c').addEventListener('click', e => {
      const r = e.target.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      for (const s of spots) {
        if (x >= s.x && x <= s.x + s.w && y >= s.y && y <= s.y + s.h) {
          document.getElementById('report').dataset.marker = 'hit:' + s.label;
        }
      }
    });
  </script>
</body>
</html>
