<!doctype html>
<html>
<head><meta charset="utf-8"><title>Canvas Only</title>
<style>
  /* Deterministic layout: canvas pinned at (0,0) so grid-cell coordinates
     map directly onto canvas-relative spot coordinates. */
  body { margin: 0; }
  h1 { position: fixed; right: 8px; top: 8px; margin: 0; }
</style></head>
<body>
  <h1>Canvas-Hostile Page</h1>
  <!-- Zero interactive DOM elements: everything is drawn. The structural
       scanner finds nothing actionable → visual fallback must engage.
       The middle spot covers coarse-grid cell m2 (x 213..427, y 0..200),
       so a marker-pick click at m2's center must register. -->
  <canvas id="c" width="800" height="600" style="border:0;display:block"></canvas>
  <div id="report" data-marker="none" style="position:fixed;left:8px;bottom:8px">none</div>
  <script>
    const ctx = document.getElementById('c').getContext('2d');
    // Draw three fake "buttons". Green covers the full m2 grid cell so the
    // marker-pick center click lands inside it regardless of sub-pixel drift.
    const spots = [{x:80,y:100,w:120,h:50,label:'Red',fill:'#c33'},
                   {x:213,y:0,w:214,h:200,label:'Green',fill:'#3a3'},
                   {x:80,y:200,w:120,h:50,label:'Blue',fill:'#33c'}];
    for (const s of spots) {
      ctx.fillStyle = s.fill; ctx.fillRect(s.x, s.y, s.w, s.h);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 18px sans-serif';
      ctx.fillText(s.label, s.x + 10, s.y + (s.h > 60 ? s.h / 2 : 32));
    }
    document.getElementById('c').addEventListener('click', e => {
      const r = e.target.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      for (const s of spots) {
        if (x >= s.x && x <= s.x + s.w && y >= s.y && y <= s.y + s.h) {
          document.getElementById('report').dataset.marker = 'hit:' + s.label;
        }
      }
    });
  </script>
</body>
</html>
