[workspace]
resolver = "2"
members = [
    "crates/joey-core",
    "crates/joey-browser",
    "crates/joey-providers",
    "crates/joey-tools",
    "crates/joey-agent-core",
    "crates/joey-cron",
    "crates/joey-mcp",
    "crates/joey-gateway",
    "crates/joey-tui",
    "crates/joey-cli",
    "crates/joey-speckit-ui",
    "crates/joey-llm-selector",
    "crates/joey-orchestration",
    "crates/joey-omo",
    "crates/joey-neurocode",
]

[workspace.package]
version = "0.19.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/joey/joey-agent"
description = "joey-agent — the self-improving AI agent, in Rust. A port of Hermes Agent (Nous Research)."

[workspace.dependencies]
joey-core = { path = "crates/joey-core" }
joey-browser = { path = "crates/joey-browser" }
joey-providers = { path = "crates/joey-providers" }
joey-tools = { path = "crates/joey-tools" }
joey-agent-core = { path = "crates/joey-agent-core" }
joey-cron = { path = "crates/joey-cron" }
joey-mcp = { path = "crates/joey-mcp" }
joey-gateway = { path = "crates/joey-gateway" }
joey-tui = { path = "crates/joey-tui" }
joey-llm-selector = { path = "crates/joey-llm-selector" }
joey-orchestration = { path = "crates/joey-orchestration" }
joey-omo = { path = "crates/joey-omo" }
joey-neurocode = { path = "crates/joey-neurocode" }

# NeuroCode (feature 015): deterministic multi-language AST parsing (FR-006).
# Originally Java-only (specs/015, ~270KB); generalized to a language registry
# with per-language grammars plus a heuristic fallback extractor for the long
# tail. Each grammar is C via cc with no transitive runtime deps (~150-300KB
# compiled each) — justified by the structural-graph ingestion pipeline.
tree-sitter = "0.26"
tree-sitter-java = "0.23"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
# Full tree-sitter supported-language coverage (tree-sitter.github.io):
# every programming-language grammar under the tree-sitter org. Same
# tree-sitter-language C ABI as above (~150-300KB compiled each).
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-haskell = "0.23"
tree-sitter-julia = "0.23"
tree-sitter-ocaml = "0.25"
tree-sitter-php = "0.24"
tree-sitter-ruby = "0.23"
tree-sitter-scala = "0.25"
tree-sitter-verilog = "1.0"
tree-sitter-agda = "1.3"

anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
bytes = "1"

reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "socks"] }
ureq = { version = "2.12", features = ["json"] }
url = "2"
percent-encoding = "2"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = "0.8"
os_pipe = "1"

clap = { version = "4", features = ["derive", "wrap_help"] }
reedline = "0.40"
nu-ansi-term = "0.50"
crossterm = "0.28"
pulldown-cmark = "0.12"
terminal_size = "0.4"
unicode-width = "0.2"
textwrap = "0.16"
ratatui = { version = "0.30", features = ["crossterm"] }

chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
cron = "0.15"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

dirs = "6"
dotenvy = "0.15"
regex = "1"
rayon = "1.12"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
globset = "0.4"
ignore = "0.4"
shellexpand = "3"
shlex = "1"
which = "7"
tempfile = "3"

base64 = "0.22"
# CDP WebSocket transport for joey-browser (feature 016). Already present in
# the lockfile via joey-speckit-ui; promoted to a workspace dependency so
# joey-browser can use it without a duplicate version pin (plan D1).
tokio-tungstenite = "0.23"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

portable-pty = "0.8"
sysinfo = "0.33"
libc = "0.2"

html2text = "0.13"
similar = "2"
strsim = "0.11"

# Syntax highlighting for diff rendering (feature 005).
# Decision: syntect 5 (Sublime Text grammars) — closest Rust analog to
# crush's `chroma`. Cost/benefit in specs/005-expandable-diff-ui/research.md.
# Declared in joey-tools (DAG-valid shared ancestor of both render crates).
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
indexmap = { version = "2", features = ["serde"] }
once_cell = "1"
unicode-normalization = "0.1"

[profile.release]
lto = "thin"
strip = true

[profile.dev]
debug = 1
